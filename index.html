<head>

<title>The World</title>
<style>
:root{--ink:#eef2ff;--deep:#0d1533;--sky:#7fb2ff;--glow:#ffd27a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block}
#lobby{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:radial-gradient(120% 80% at 50% 110%,#ff9a6b 0,#5a4a9e 35%,var(--deep) 75%)}
#lobby h1{font-size:44px;font-weight:400;font-style:italic;margin:0 0 4px;letter-spacing:.02em}
#lobby p{margin:0 0 14px;opacity:.75;font-size:16px}
input,button{font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:0;width:min(320px,100%)}
input{background:#ffffff1f;color:var(--ink);text-align:center;outline:1px solid #ffffff33}
input::placeholder{color:#ffffff88}
button{background:var(--glow);color:#2a1c00;font-weight:700}
button.alt{background:#ffffff26;color:var(--ink);font-weight:400}
#msg{min-height:1.4em;font-size:15px;color:#ffd0d0}
#hud{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:none;justify-content:space-between;align-items:flex-start;font-size:15px;text-shadow:0 1px 4px #000;pointer-events:none}
#hud button{pointer-events:auto;width:auto;padding:8px 14px;font-size:14px;background:#00000066;color:var(--ink);font-weight:400}
#stick{position:fixed;z-index:5;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);width:128px;height:128px;border-radius:50%;background:#ffffff1a;outline:1px solid #ffffff33;display:none}
#knob{position:absolute;left:calc(50% - 20px);top:calc(50% - 20px);width:40px;height:40px;border-radius:50%;background:#ffffffaa;pointer-events:none}
#jump{position:fixed;z-index:5;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 52px);width:88px;height:88px;border-radius:50%;padding:0;display:none;background:#ffd27acc}
#banner{position:fixed;z-index:6;top:22%;left:0;right:0;text-align:center;font-size:26px;font-style:italic;text-shadow:0 2px 10px #000;opacity:0;transition:opacity .6s;pointer-events:none}#banner small{font-size:12px;letter-spacing:.25em;font-style:normal;opacity:.8}
#boost{position:fixed;z-index:5;right:126px;bottom:calc(env(safe-area-inset-bottom,0px) + 58px);width:76px;height:76px;border-radius:50%;padding:0;display:none;background:#7fd0ffdd;color:#06304a;font-size:13px;opacity:.75}
#smack{position:fixed;z-index:5;right:126px;bottom:calc(env(safe-area-inset-bottom,0px) + 58px);width:76px;height:76px;border-radius:50%;padding:0;display:none;background:#ffb0b0dd;color:#4a0606;font-size:13px}
#emobtn{position:fixed;z-index:5;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 396px);width:52px;height:52px;border-radius:50%;padding:0;display:none;background:#ffffffcc;font-size:26px}
#emopanel{position:fixed;z-index:12;left:0;right:0;bottom:0;max-height:58vh;overflow-y:auto;display:none;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 16px);background:#0d1330f2;border-radius:18px 18px 0 0;color:#fff;box-shadow:0 -6px 30px #0008}
#emopanel h4{margin:10px 4px 6px;font-size:13px;opacity:.7;letter-spacing:.08em;text-transform:uppercase}
#emopanel .row{display:flex;flex-wrap:wrap;gap:8px}
#emopanel button{position:static;width:auto;height:auto;border-radius:14px;padding:9px 12px;font-size:15px;background:#ffffff1f;color:#fff;border:0;display:block}
#emopanel .x{position:sticky;top:0;float:right;font-size:18px;padding:4px 12px;background:#ffffff33}
#panbtn{position:fixed;z-index:5;right:136px;bottom:calc(env(safe-area-inset-bottom,0px) + 144px);width:56px;height:56px;border-radius:50%;padding:0;display:none;background:#ffffffcc;font-size:26px;opacity:.6}
#flash{position:fixed;z-index:8;inset:0;background:#ff0000;opacity:0;pointer-events:none;transition:opacity .08s}
#use{position:fixed;z-index:5;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 156px);display:none;width:auto;padding:12px 22px;background:#ffffffdd;color:#1a1f3a}
#skinRow button{flex:1;padding:8px 4px;font-size:12px;border-radius:10px;background:#ffffff14;border:1px solid #ffffff33;color:#fff}
#skinRow button.sel{background:#ffd27a;color:#1a1f3a;border-color:#ffd27a}
#pmk{position:fixed;z-index:5;transform:translate(-50%,-50%);color:#7fd0ff;text-align:center;font-size:22px;line-height:1;text-shadow:0 0 8px #000,0 2px 6px #000;pointer-events:none;display:none}

#fshint{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);padding:6px 14px;border-radius:14px;background:#000a;color:#fff;font-size:12px;pointer-events:none;display:none;white-space:nowrap}
/* ===== Landscape-first mobile =====
   THE WORLD is played in landscape on phones. Portrait/desktop keep the original layout above; the block below only applies to
   touch devices held sideways. Everything is sized from viewport height (dvh) + safe-area insets, so it adapts to any phone. */
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
#rotate{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(120% 80% at 50% 110%,#ff9a6b 0,#5a4a9e 35%,var(--deep) 75%)}
#rotate .ic{font-size:64px;line-height:1;animation:wlrot 2.4s ease-in-out infinite}
#rotate b{font-size:24px;font-weight:400;font-style:italic}#rotate span{opacity:.75;font-size:15px}
@keyframes wlrot{0%,15%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (pointer:coarse) and (orientation:portrait) and (max-width:700px){#rotate{display:flex}}
@media (orientation:landscape) and (max-height:520px){
  #lobby{overflow-y:auto;justify-content:flex-start;gap:8px;padding:calc(var(--st) + 12px) calc(var(--sr) + 16px) calc(var(--sb) + 12px) calc(var(--sl) + 16px)}
  #lobby>:first-child{margin-top:auto}#lobby>:last-child{margin-bottom:auto}
  #lobby h1{font-size:30px;margin:0}#lobby p{margin:0 0 4px;font-size:14px}
  input,button{padding:10px 14px;font-size:16px}
  #skinRow{margin:2px 0!important}
}
@media (orientation:landscape) and (pointer:coarse){
  :root{
    --m:14px;--g:8px;
    --J:clamp(58px,22dvh,78px);   /* jump */
    --B:clamp(50px,18dvh,64px);   /* boost / smack */
    --F:clamp(54px,20dvh,70px);   /* fire */
    --S:clamp(40px,14dvh,50px);   /* small round buttons */
    --T:clamp(38px,12dvh,44px); /* top utility buttons */
    --SK:clamp(96px,38dvh,128px); /* joystick */
    --R0:calc(var(--sr) + var(--m));--L0:calc(var(--sl) + var(--m) + 4px);--B0:calc(var(--sb) + var(--m));
    --tf:18px;
    /* top-right utility row, right to left: Invite, map, journal, weather */
    --map-r:calc(var(--sr) + 12px + 76px + var(--g));--map-t:calc(var(--st) + 8px);
    --jr-r:calc(var(--map-r) + var(--T) + var(--g));--jr-t:var(--map-t);
    --wx-r:calc(var(--jr-r) + var(--T) + var(--g));--wx-t:var(--map-t);
    --topmsg:calc(var(--st) + 56px);--topmsg-tag:calc(var(--st) + 60px);--msgfs:15px;
    --bar-b:calc(var(--sb) + var(--m));--bar-l:calc(var(--L0) + var(--SK) + 12px);--bar-tf:none;--barw:min(180px,24vw);
    --sheet-h:86dvh;--sheet-px:calc(max(var(--sl),var(--sr)) + 14px);
  }
  body #hud{top:calc(var(--st) + 8px);left:calc(var(--sl) + 12px);right:calc(var(--sr) + 12px);font-size:13px;line-height:1.3}
  body #hud button{height:var(--T);padding:0;width:76px;font-size:13px}
  body #banner{top:26%;font-size:20px}
  body #owhud{left:calc(var(--sl) + 12px);top:calc(var(--st) + 52px)}
  /* left thumb: joystick, with a row of small buttons above it */
  body #stick{left:var(--L0);bottom:var(--B0);width:var(--SK);height:var(--SK)}
  body #emobtn,body #panbtn,body #owshop,body #owview{right:auto;bottom:calc(var(--B0) + var(--SK) + var(--g));width:var(--S);height:var(--S);font-size:20px}
  body #emobtn{left:var(--L0)}
  body #panbtn{left:calc(var(--L0) + var(--S) + var(--g))}
  body #owshop{left:calc(var(--L0) + 2*(var(--S) + var(--g)))}
  body #owview{left:calc(var(--L0) + 3*(var(--S) + var(--g)))}
  /* right thumb: jump + boost/smack/use on the bottom row, fire/reload/weapon above */
  body #jump{right:var(--R0);bottom:var(--B0);width:var(--J);height:var(--J);font-size:15px}
  body #boost,body #smack{right:calc(var(--R0) + var(--J) + var(--g));bottom:var(--B0);width:var(--B);height:var(--B);font-size:12px}
  body #use{right:calc(var(--R0) + var(--J) + var(--B) + 2*var(--g));bottom:calc(var(--B0) + 4px);min-height:44px;padding:10px 16px;font-size:15px}
  body #owfire{right:var(--R0);bottom:calc(var(--B0) + var(--J) + var(--g));width:var(--F);height:var(--F)}
  body #sockick{right:var(--R0);bottom:calc(var(--B0) + var(--J) + var(--F) + 2*var(--g));width:var(--F);height:var(--F);font-size:24px}
  body #owrl,body #owgun{bottom:calc(var(--B0) + var(--J) + var(--g) + (var(--F) - var(--S))/2);width:var(--S);height:var(--S);font-size:20px}
  body #owrl{right:calc(var(--R0) + var(--F) + var(--g))}
  body #owgun{right:calc(var(--R0) + var(--F) + var(--S) + 2*var(--g))}
  body #emopanel{max-height:var(--sheet-h);padding-left:var(--sheet-px);padding-right:var(--sheet-px)}
}
</style>

<script>
const SUPABASE_URL='https://lzqnxawxehmqgswuzpyn.supabase.co';
const SUPABASE_KEY='sb_publishable_bAm2KsLV8__Y4nWSFesZeQ_38-Ly6DE';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
const msg=t=>$('msg').textContent=t||'';
const ALPHA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genCode=()=>{let s='';for(let i=0;i<8;i++)s+=ALPHA[Math.random()*ALPHA.length|0];return s.slice(0,4)+'-'+s.slice(4)};
const normCode=v=>{const c=v.toUpperCase().replace(/[^A-Z0-9]/g,'');return c.length===8?c.slice(0,4)+'-'+c.slice(4):null};
const myId=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));
if(THREE.ColorManagement)THREE.ColorManagement.legacyMode=false;
function showErr(e){let d=document.getElementById('err');if(!d){d=document.createElement('div');d.id='err';d.style.cssText='position:fixed;z-index:99;left:8px;right:8px;top:110px;padding:10px;background:#5a0d0dcc;color:#fff;font:12px monospace;white-space:pre-wrap;word-break:break-all;pointer-events:none';document.body.appendChild(d)}const t=String(e&&(e.stack||e.message)||e).slice(0,300);if(!d.textContent.includes(t))d.textContent+=t+'\n';clearTimeout(d._t);d._t=setTimeout(()=>d.remove(),8000)}
addEventListener('error',ev=>showErr(ev.error||ev.message));addEventListener('unhandledrejection',ev=>showErr(ev.reason));
function boot(t){let d=document.getElementById('boot');if(!t){d&&d.remove();return}if(!d){d=document.createElement('div');d.id='boot';d.style.cssText='position:fixed;z-index:9;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-style:italic;pointer-events:none;color:#fff';document.body.appendChild(d)}d.textContent=t}
const COLORS=['#ff6b8b','#ffb454','#6bd6ff','#8dff9a','#c08bff','#ffe66b'];
const myColor=COLORS[Math.random()*COLORS.length|0];
const SKINLABELS=['Man','Woman','Warrior','Robot'];
let mySkin=1;
{const row=$('skinRow');SKINLABELS.forEach((lab,i)=>{const b=document.createElement('button');b.textContent=lab;if(i===mySkin)b.className='sel';
  b.onclick=()=>{mySkin=i;[...row.children].forEach((c,k)=>c.className=k===i?'sel':'')};row.appendChild(b)})}

const pre=new URLSearchParams(location.search).get('room');
if(pre)$('code').value=pre;

// Total fullscreen in landscape on touch devices. Browsers only allow fullscreen from a user tap, so we (a) ask on Create/Join and
// (b) re-ask on the first tap whenever we're in-game, landscape and not fullscreen (arriving via ?room= link, rotating later, or
// swiping out of fullscreen). Fullscreen also unlocks screen.orientation.lock('landscape') on Android Chrome. iPhone Safari has no
// fullscreen API for pages: there, "Add to Home Screen" gives the same result (the apple-mobile-web-app-capable meta is set).
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsCan=()=>{const e=document.documentElement;return !!(e.requestFullscreen||e.webkitRequestFullscreen)};
const coarse=()=>matchMedia('(pointer:coarse)').matches;
function wantLandscape(){try{if(!coarse())return;const lock=()=>{try{const r=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');if(r&&r.catch)r.catch(()=>{})}catch(e){}};
  if(fsEl()){lock();return}
  const el=document.documentElement,r=el.requestFullscreen?el.requestFullscreen({navigationUI:'hide'}):el.webkitRequestFullscreen?el.webkitRequestFullscreen():null;
  if(r&&r.then)r.then(lock,()=>{});else lock()}catch(e){}}
const inGame=()=>getComputedStyle($('lobby')).display==='none';
const landscapeNow=()=>matchMedia('(orientation:landscape)').matches;
['pointerup','touchend','click'].forEach(ev=>addEventListener(ev,()=>{if(coarse()&&fsCan()&&!fsEl()&&inGame()&&landscapeNow())wantLandscape()},{capture:true,passive:true}));
// small hint until fullscreen is on
(()=>{const h=document.createElement('div');h.id='fshint';h.textContent='Tap anywhere for fullscreen';document.body.appendChild(h);
  const sync=()=>{h.style.display=(coarse()&&fsCan()&&!fsEl()&&inGame()&&landscapeNow())?'block':'none'};
  ['fullscreenchange','webkitfullscreenchange','resize','orientationchange'].forEach(e=>addEventListener(e,sync));document.addEventListener('fullscreenchange',sync);setInterval(sync,1000)})();
$('create').onclick=()=>{wantLandscape();enter(genCode())};
$('join').onclick=()=>{const c=normCode($('code').value);if(!c)return msg('Enter a code like KAMI-7X4P');wantLandscape();enter(c)};

let chan,roomCode,myName,entered=false,joining=false,gameStarted=false;
const others=new Map(); // id -> {group,tx,ty,tz,tr,meta}

async function enter(code){
  if(joining||entered)return;joining=true;                      // ignore extra taps on Create/Join while connecting
  myName=($('name').value.trim()||'Player').slice(0,16);
  roomCode=code;msg('Connecting…');
  chan=sb.channel('world:'+code,{config:{broadcast:{self:false},presence:{key:myId}}});
  Net.attach(chan);
  chan.on('broadcast',{event:'s'},({payload})=>onState(payload));
  chan.on('presence',{event:'sync'},syncPresence);
  chan.on('broadcast',{event:'c'},({payload})=>take(payload.i,false));
  chan.on('broadcast',{event:'u'},()=>{pulse=1.5;chime()});
  chan.on('broadcast',{event:'rs'},()=>startRace(false));
  chan.on('broadcast',{event:'ks'},()=>startKartRace(false));
  chan.on('broadcast',{event:'kp'},({payload})=>{kart.pi=payload.i});
  chan.on('broadcast',{event:'kf'},({payload})=>{if(kart.on)banner('Partner finished in '+fmt(payload.ms),'RACE TRACK')});
  chan.on('broadcast',{event:'hs'},({payload})=>startHunt(false,payload.n));
  chan.on('broadcast',{event:'hf'},()=>dig(false));
  chan.on('broadcast',{event:'rp'},({payload})=>{race.pi=payload.i});
  chan.on('broadcast',{event:'rf'},({payload})=>{if(race.on)banner('Partner finished in '+fmt(payload.ms),'SKY RACE')});
  chan.on('broadcast',{event:'og'},({payload})=>Outlaw.onMsg(payload));
  chan.on('broadcast',{event:'tg'},({payload})=>Tag.onMsg(payload));
  chan.on('broadcast',{event:'bs'},()=>startRing(false));
  chan.on('broadcast',{event:'bo'},({payload})=>ringPoint(payload));
  chan.on('broadcast',{event:'ss'},()=>startSharkRun(false));
  chan.on('broadcast',{event:'sls'},()=>startSlalom(false));
  chan.on('broadcast',{event:'ds'},()=>startDash(false));
  chan.on('broadcast',{event:'em'},({payload})=>{const o=others.get(payload.from);if(o)loadEmotes().then(()=>{o.group.userData.emoteReq=payload.e}).catch(()=>{})});
  chan.on('broadcast',{event:'df'},({payload})=>{if(dash.on)banner('Partner finished in '+fmt(payload.ms),'OBSTACLE DASH')});
  chan.on('broadcast',{event:'slp'},({payload})=>{slalom.pi=payload.i});
  chan.on('broadcast',{event:'slf'},({payload})=>{if(slalom.on)banner('Partner finished in '+fmt(payload.ms),'SKY SLALOM')});
  chan.on('broadcast',{event:'sf'},({payload})=>{if(srun.on)banner('Partner finished in '+fmt(payload.ms),'SHARK RUN')});
  chan.on('broadcast',{event:'sm'},({payload})=>{if(payload.from!==myId)onSmacked(payload)});

  srun.gates.forEach((g,i)=>{g.g.visible=i>=srun.i;g.g.scale.setScalar(i===srun.i?1+Math.sin(t/200)*.06:.8)});
  if(now<srun.t0){srun.el.style.fontSize='44px';srun.el.textContent=Math.ceil((srun.t0-now)/1000);return}
  srun.el.style.fontSize='18px';if(S.flying)S.flying=false;
  for(const o of srun.saved){const s=o.s,sd=Math.hypot(S.x-s.m.position.x,S.z-s.m.position.z); // a bite = a shark actually reaching me
    if(sd<2.6&&S.y<.5&&now-s.bitAt>2500){s.bitAt=now;srun.bites++;onSmacked({dx:(S.x-s.m.position.x)/Math.max(sd,.01),dz:(S.z-s.m.position.z)/Math.max(sd,.01)});sharkBite()}}

    if(srun.i>n){const ms=now-srun.t0+srun.bites*SR_PEN;let best=+localStorage.getItem('w4shark')||1e12;const nb=ms<best;try{if(nb)localStorage.setItem('w4shark',ms)}catch(e){}
      banner(fmt(ms)+(nb?' · new best!':' · best '+fmt(best)),'SHARK RUN · '+srun.bites+(srun.bites===1?' BITE':' BITES'));
      if(chan)chan.send({type:'broadcast',event:'sf',payload:{ms}});endSharkRun();return}}
  srun.el.textContent='Shark Run  ·  '+(srun.i<n?'Buoy '+(srun.i+1)+'/'+n:'Back to the pad!')+'  ·  '+fmt(now-srun.t0+srun.bites*SR_PEN)+'  ·  🦈 '+srun.bites+(srun.bites?' (+'+srun.bites*3+'s)':'');
}

// ---------- sky slalom (weave 12 tight rings around the floating island; a near-centre pass is "perfect": boost + 0.5s off) ----------

  const sb=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,60,10,1,true),new THREE.MeshBasicMaterial({color:'#7fd0ff',transparent:true,opacity:.28,depthWrite:false,fog:false,side:THREE.DoubleSide}));sb.position.set(pad.x,pad.y+30,pad.z);scene.add(sb);

// ---------- obstacle dash (parkour course: stepping stones, a beam, moving platforms, a bounce pad, a tower; each fall = +2s and back to your last platform) ----------
const OD_FALL=2000;
// u = metres along the course, v = sideways, r = platform radius, h = top height above the start ground. Jumps reach ~1.6 m up / ~8 m across (checked in a physics sim).
const OD=[
  {k:'stone',u:6,v:0,r:1.7,h:.8},{k:'stone',u:11.5,v:-2.5,r:1.5,h:1.4},{k:'stone',u:17,v:2,r:1.5,h:2},{k:'stone',u:23,v:-1.5,r:1.4,h:2.6},
  {k:'beam',u0:27,u1:37,v:0,r:.6,h:2.6},
  {k:'move',u:42,v:0,r:1.6,h:2.6,amp:3,per:4,ph:0},{k:'move',u:48.5,v:0,r:1.6,h:3.2,amp:3,per:4,ph:2},
  {k:'bounce',u:54.5,v:0,r:2,h:2},
  {k:'stone',u:60,v:0,r:3,h:6.5},{k:'stone',u:66,v:-2,r:1.6,h:7.5},{k:'stone',u:72.5,v:0,r:2.4,h:8.5,fin:true}];

  for(const tol of [.9,1.4])for(let r=60;r<=190;r+=10)for(let ai=0;ai<36;ai++)for(let hi=0;hi<8;hi++){ // second pass tolerates a gentler slope if the first finds nothing
    const a=ai/36*6.283,ox=Math.cos(a)*r,oz=Math.sin(a)*r,th=hi/8*6.283,g0=H(ox,oz);if(g0<1)continue;

    for(let u=-4;u<=78&&ok;u+=4)for(const v of [-6,0,6]){const x=ox+u*c-v*s,z=oz+u*s+v*c,h=H(x,z);if(h<1||Math.abs(h-g0)>tol||ex(x,z)){ok=false;break}pts.push([x,z])}
    if(!ok)continue;
    if(solids.some(q=>pts.some(p=>Math.hypot(q.x-p[0],q.z-p[1])<q.r+3.5)))continue;

  const sb=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,40,10,1,true),new THREE.MeshBasicMaterial({color:'#ff6ea1',transparent:true,opacity:.28,depthWrite:false,fog:false,side:THREE.DoubleSide}));sb.position.set(site.ox,g0+20,site.oz);scene.add(sb);
  for(const d of OD){const top=g0+d.h,mat=new THREE.MeshStandardMaterial({color:col[d.k]||'#6ec6ff',roughness:.7});let p={k:d.k,top,fin:!!d.fin,c:[]};
    if(d.k==='beam'){const n=Math.round((d.u1-d.u0)/.8);for(let i=0;i<=n;i++){const w=dashW(d.u0+(d.u1-d.u0)*i/n,d.v),q={x:w.x,z:w.z,r:d.r,h:top};solids.push(q);p.c.push(q)}

    else{const w=dashW(d.u,d.v),q={x:w.x,z:w.z,r:d.r,h:top};
      if(d.k==='move'){q.noSide=true;p.u=d.u;p.amp=d.amp;p.per=d.per;p.ph=d.ph;p.last={x:w.x,z:w.z};

      else{const m=new THREE.Mesh(new THREE.CylinderGeometry(d.r+.35,d.r+.35,d.h+2,20),mat);m.position.set(w.x,g0-2+(d.h+2)/2,w.z);scene.add(m);
        if(d.k==='bounce'){const ring=new THREE.Mesh(new THREE.TorusGeometry(d.r*.6,.18,8,24),new THREE.MeshBasicMaterial({color:'#ffffff'}));ring.rotation.x=Math.PI/2;ring.position.set(w.x,top+.08,w.z);scene.add(ring)}
        if(d.fin){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,5,8),new THREE.MeshStandardMaterial({color:'#ffffff'}));pole.position.set(w.x,top+2.5,w.z);scene.add(pole);
          const fl=new THREE.Mesh(new THREE.PlaneGeometry(2.4,1.4),new THREE.MeshBasicMaterial({color:'#ffd24a',side:THREE.DoubleSide}));fl.position.set(w.x+1.2*Math.cos(dash.th+1.57),top+4.2,w.z+1.2*Math.sin(dash.th+1.57));fl.rotation.y=-dash.th;scene.add(fl)}}

}
function startDash(local){

  banner('Hop the course to the flag · every fall = +2s','OBSTACLE DASH');
  if(local&&chan)chan.send({type:'broadcast',event:'ds',payload:{}});
}

  if(!dash.start)return;

  for(const p of dash.plats)if(p.k==='move'){ // slide sideways; carry anyone standing on it
    const q=p.c[0],on=S.grounded&&Math.abs(S.y-p.top)<.35&&Math.hypot(S.x-q.x,S.z-q.z)<q.r+.4;
    const w=dashW(p.u,Math.sin(tt/p.per*6.283+p.ph)*p.amp);if(on){S.x+=w.x-q.x;S.z+=w.z-q.z}q.x=w.x;q.z=w.z;p.m.position.x=w.x;p.m.position.z=w.z}

  if(S.grounded)dash.plats.forEach((p,i)=>{if(on<0&&Math.abs(S.y-p.top)<.35&&p.c.some(q=>Math.hypot(S.x-q.x,S.z-q.z)<q.r+.4))on=i});
  if(on>=0&&dash.plats[on].k==='bounce'&&now-dash.lastB>400){dash.lastB=now;S.vy=17;S.grounded=false;chime()}
  if(!dash.on){if(dash.el)dash.el.style.display='none';return}
  dash.el.style.display='block';
  if(now<dash.t0){dash.el.style.fontSize='44px';dash.el.textContent=Math.ceil((dash.t0-now)/1000);return}
  dash.el.style.fontSize='18px';if(S.flying)S.flying=false;
  if(on>=0){dash.cp=on;dash.far=Math.max(dash.far,on+1);
    if(dash.plats[on].fin){const ms=now-dash.t0+dash.falls*OD_FALL;let best=+localStorage.getItem('w4dash')||1e12;const nb=ms<best;try{if(nb)localStorage.setItem('w4dash',ms)}catch(e){}
      banner(fmt(ms)+(nb?' · new best!':' · best '+fmt(best)),'OBSTACLE DASH · '+dash.falls+(dash.falls===1?' FALL':' FALLS'));dash.on=false;if(chan)chan.send({type:'broadcast',event:'df',payload:{ms}});return}}

    banner('Splat! +2s','OBSTACLE DASH')}

}

// ---------- sky race ----------
const race={on:false,i:0,pi:0,t0:0,rings:[],el:null};
let bvis=false;const bst=()=>S.flying&&(S.boost||S.burst>0);
function buildRace(){
  const pts=[];
  for(let k=0;k<WP.length-1;k++){const [ax,az]=WP[k],[bx,bz]=WP[k+1],n=Math.max(1,Math.round(Math.hypot(bx-ax,bz-az)/230));
    for(let j=k?1:0;j<=n;j++){const x=ax+(bx-ax)*j/n,z=az+(bz-az)*j/n;pts.push([x,Math.max(H(x,z)+34,40),z])}}
  race.rings=pts.map((p,i)=>{const m=new THREE.Mesh(new THREE.TorusGeometry(14,1.4,10,48),new THREE.MeshBasicMaterial({color:'#7fd0ff',fog:false,transparent:true,opacity:.45}));
    m.position.set(p[0],p[1],p[2]);const q=pts[Math.min(i+1,pts.length-1)],r=pts[Math.max(i-1,0)];
    m.lookAt(i<pts.length-1?q[0]:p[0]+(p[0]-r[0]),i<pts.length-1?q[1]:p[1],i<pts.length-1?q[2]:p[2]+(p[2]-r[2]));scene.add(m);return {m,x:p[0],y:p[1],z:p[2]}});
  const pad=new THREE.Mesh(new THREE.CylinderGeometry(4,4,.3,24),new THREE.MeshStandardMaterial({color:'#ffd24a',emissive:'#ff9d00',emissiveIntensity:.8}));
  pad.position.set(WP[0][0],H(WP[0][0],WP[0][1])+.2,WP[0][1]);scene.add(pad);
  if(!race.el){const d=document.createElement('div');d.style.cssText='position:fixed;z-index:6;top:var(--topmsg,calc(env(safe-area-inset-top,0px) + 92px));left:0;right:0;text-align:center;font-size:var(--msgfs,18px);text-shadow:0 2px 8px #000;pointer-events:none;display:none';document.body.appendChild(d);race.el=d}
  race.beam=new THREE.Mesh(new THREE.CylinderGeometry(2.5,2.5,500,12,1,true),new THREE.MeshBasicMaterial({color:'#ffd24a',transparent:true,opacity:.3,fog:false,depthWrite:false,side:THREE.DoubleSide}));race.beam.visible=false;scene.add(race.beam);
  paint();
}
function paint(){race.rings.forEach((r,i)=>{const on=race.on,act=on&&i===race.i;r.m.visible=!(on&&i<race.i);
  r.m.material.color.set(act?'#ffd24a':'#7fd0ff');r.m.material.opacity=act?1:on?.5:.45;r.m.scale.setScalar(act?1.15:1)});
  if(race.beam){const a=race.rings[race.i];race.beam.visible=race.on&&!!a;if(a)race.beam.position.set(a.x,a.y,a.z)}}

  if(local&&chan)chan.send({type:'broadcast',event:'rs',payload:{}});
}
function raceTick(t){
  if(!race.on){if(race.el)race.el.style.display='none';return}
  const now=performance.now();race.el.style.display='block';
  if(now<race.t0){race.el.style.fontSize='44px';race.el.textContent=Math.ceil((race.t0-now)/1000);return}
  race.el.style.fontSize='18px';
  const R=race.rings[race.i];
  if(Math.hypot(S.x-R.x,S.y+1-R.y,S.z-R.z)<13){race.i++;chime();S.burst=1.4;
    if(chan)chan.send({type:'broadcast',event:'rp',payload:{i:race.i}});
    if(race.i>=race.rings.length){const ms=now-race.t0;let best=+localStorage.getItem('w4best')||1e12;const nb=ms<best;try{if(nb)localStorage.setItem('w4best',ms)}catch(e){}
      banner(fmt(ms)+(nb?' · new best!':' · best '+fmt(best)),'RACE COMPLETE');race.on=false;paint();if(chan)chan.send({type:'broadcast',event:'rf',payload:{ms}});return}

}

// ---------- treasure hunt ----------
let mk=null,pmk=null,treas=0;try{treas=+localStorage.getItem('w4t')||0}catch(e){}
const hunt={on:false,n:0,x:0,y:0,z:0,open:0,chest:null,beam:null};
const _mv=new THREE.Vector3();

  const o=others.size?others.values().next().value:null;

  const p=o.group.position,d=Math.hypot(S.x-p.x,S.z-p.z);
  markToEl(pmk,p.x,p.y+2.4,p.z,(o.group.userData.nm||'Partner')+' · '+(d<50?Math.round(d):Math.round(d/10)*10)+'m');

function buildHunt(){
  const g=new THREE.Group(),wood=new THREE.MeshStandardMaterial({color:'#6b4a2f'}),pap=new THREE.MeshStandardMaterial({color:'#f3e2b3',emissive:'#5a4a20'});
  const p1=new THREE.Mesh(new THREE.BoxGeometry(.25,3,.25),wood);p1.position.set(-1.3,1.5,0);const p2=p1.clone();p2.position.x=1.3;
  const bd=new THREE.Mesh(new THREE.BoxGeometry(3.4,1.8,.15),pap);bd.position.y=2.6;g.add(p1,p2,bd);
  g.position.set(BOARD.x,H(BOARD.x,BOARD.z),BOARD.z);scene.add(g);solids.push({x:BOARD.x,z:BOARD.z,r:1.4});
  const c=new THREE.Group(),base=new THREE.Mesh(new THREE.BoxGeometry(1.6,.9,1),new THREE.MeshStandardMaterial({color:'#7a4a1f'}));base.position.y=.45;
  const lid=new THREE.Group();lid.position.set(0,.9,-.5);const lm=new THREE.Mesh(new THREE.BoxGeometry(1.6,.35,1),new THREE.MeshStandardMaterial({color:'#f2c14e',emissive:'#7a5a00'}));lm.position.set(0,.17,.5);lid.add(lm);

  hunt.beam=new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,90,10,1,true),new THREE.MeshBasicMaterial({color:'#ffd24a',transparent:true,opacity:.45,fog:false,depthWrite:false,side:THREE.DoubleSide}));hunt.beam.visible=false;scene.add(hunt.beam);
  pmk=document.getElementById('pmk');
if(!mk){mk=document.createElement('div');mk.style.cssText='position:fixed;z-index:5;transform:translate(-50%,-50%);color:#ffd24a;text-align:center;font-size:28px;line-height:1;text-shadow:0 0 8px #000,0 2px 6px #000;pointer-events:none;display:none';mk.innerHTML='<div>◆</div><small style="font-size:13px"></small>';document.body.appendChild(mk)}
}
function pickTarget(n){

  for(let i=0;i<400;i++){const L=lands[r()*lands.length|0],a=r()*6.283,d=Math.sqrt(r())*L.R,x=L.x+Math.cos(a)*d,z=L.z+Math.sin(a)*d,h=H(x,z);

function startHunt(local,n){

}
function dig(local){
  if(!hunt.on)return;hunt.on=false;hunt.open=2.5;hunt.chest.visible=true;hunt.chest.position.set(hunt.x,hunt.y-.9,hunt.z);hunt.beam.visible=false;chime();
  treas++;try{localStorage.setItem('w4t',treas)}catch(e){}if(local)try{WS.log('treasure','hunt:'+hunt.n,{x:hunt.x,z:hunt.z})}catch(e){}save();updateHud();
  banner(local?'You found the treasure!':'Your partner found the treasure!','TREASURE FOUND');

function huntTick(dt,t){
  if(hunt.on){const d=Math.hypot(S.x-hunt.x,S.z-hunt.z);hunt.beam.visible=d<160;
    if(!race.on)markTo(hunt.x,hunt.y+2,hunt.z,'Treasure · '+(d<50?Math.round(d):Math.round(d/10)*10)+' m')}
  if(hunt.open>0){hunt.open=Math.max(0,hunt.open-dt);const k=1-hunt.open/2.5;
    hunt.chest.position.y=hunt.y-.9+Math.min(1,k*2)*1.3;hunt.chest.userData.lid.rotation.x=-Math.min(1,Math.max(0,k*2-.6))*1.8;hunt.chest.rotation.y+=dt*.6}
}

// ---------- loop ----------// ---------- loop ----------
let last=performance.now(),fpsA=.016,fpsN=0;
let lastErrMsg='',lastErrAt=0;
function tick(t){
  try{tickFrame(t)}
  catch(e){const m=String(e&&e.stack||e).slice(0,600),n=performance.now();
    if(m!==lastErrMsg||n-lastErrAt>5000){lastErrMsg=m;lastErrAt=n;showErr(e);try{localStorage.setItem('w4lasterr',new Date().toISOString()+'\n'+m)}catch(_){}}   // keep the last error so we can read it after a refresh
    try{last=t}catch(_){}}
  requestAnimationFrame(tick);
}
function tickFrame(t){

  const sy=Math.sin(S.yaw),cy=Math.cos(S.yaw),px=S.x,pz=S.z;
  const dx=cy*ix+sy*iy,dz=-sy*ix+cy*iy;
  if(S.flying){ // flight has inertia: takeoff ~0.5 s to full speed, glide-out when you let go
    const tx=len>.05?dx*speed:0,tz=len>.05?dz*speed:0,cur=Math.hypot(S.fvx||0,S.fvz||0),kk=1-Math.exp(-(Math.hypot(tx,tz)>cur?4:3.2)*dt);
    S.fvx=(S.fvx||0)+(tx-(S.fvx||0))*kk;S.fvz=(S.fvz||0)+(tz-(S.fvz||0))*kk;{const sMul=SpaceFlight.moveMulH(S.y);S.x+=S.fvx*dt*sMul;S.z+=S.fvz*dt*sMul}Locomotion.carry(S);

  }else{S.fvx=S.fvz=0;Locomotion.move(S,len>.05?dx*speed:0,len>.05?dz*speed:0,dt,!S.grounded?'air':H(S.x,S.z)<-.5?'swim':'ground');if(len>.05)S.rot=lerpAngle(S.rot,Math.atan2(dx,dz),1-Math.exp(-14*dt))}
  S.x+=S.kx*dt;S.z+=S.kz*dt;const kd=Math.exp(-4*dt);S.kx*=kd;S.kz*=kd;

  const rr=Math.hypot(S.x,S.z);const RB=SpaceFlight.bound(S.y);if(rr>RB){S.x*=RB/rr;S.z*=RB/rr}
  let gY=H(S.x,S.z);
  {const dxs=S.x-SKY.x,dzs=S.z-SKY.z;if(Math.hypot(dxs,dzs)<SKY.R*2.8){const sh=SKYG(dxs,dzs);if(sh>-1e8&&S.y>=sh-3)gY=Math.max(gY,sh)}}
  let wat=gY<-.5;if(wat)gY=-1;

  for(const c of solids){if(hi)break;const ax=S.x-c.x,az=S.z-c.z,dd=Math.hypot(ax,az),R=c.r+.4;
    if(dd<R){if(c.h&&S.y>=c.h-.15)gY=Math.max(gY,c.h);else if(!c.noSide&&dd>1e-4){S.x=c.x+ax/dd*R;S.z=c.z+az/dd*R}}}
  if(wat&&gY>-.5)wat=false; // standing on something (a bridge deck over the sea) is not swimming
  const wasG=S.grounded;
  S.coy=wasG?.12:Math.max(0,(S.coy||0)-dt);                                    // coyote time: a jump pressed just after walking off a ledge still jumps
  if(jumpQ){if((wasG||S.coy>0)&&!S.flying){S.vy=wat?6:9;S.coy=0;if(typeof Ambience!=='undefined')Ambience.jump()}else{S.flying=!S.flying;if(S.flying&&!S.tipped){S.tipped=1;banner('Drag up to climb · drag down to dive','FLYING')}}}jumpQ=false;
  if(S.flying)S.vy+=((len>.05?Math.max(-20*(bst()?2.4:1),Math.min(14*(bst()?2.4:1),(CameraRig.neutralPitch()-S.pitch)*40*(bst()?2.4:1))):0)-S.vy)*Math.min(1,dt*6);else S.vy=SpaceFlight.fall(S.vy,S.y,dt);   // heavier on the way down = snappier, less floaty jump (same height); terminal velocity
  const imp=SpaceFlight.landImpact(-S.vy);S.y+=SpaceFlight.dy(S.vy,S.y,S.flying,dt);if(S.flying)S.y=Math.min(S.y,SpaceFlight.CEIL); // above ~900 m flight scales with altitude (src/space/SpaceFlight.js); ceiling 90 km

  if(typeof Ambience!=='undefined'){const es=Env.state,gs=Math.hypot(S.gvx||0,S.gvz||0);   // world sound: ocean/wind/birds/steps... (src/audio/Ambience.js); wind follows flight + fall speed
    Ambience.update(dt,{x:S.x,y:S.y,z:S.z,gy:gY,H,st:S.state,grounded:S.grounded,under:S.under||0,dayF:es.dayF,rain:es.wx.rain,storm:es.wx.storm,cloud:es.inCloud,
