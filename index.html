<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>The World</title>
<style>
:root{--ink:#eef2ff;--deep:#0d1533;--sky:#7fb2ff;--glow:#ffd27a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block}
#lobby{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:radial-gradient(120% 80% at 50% 110%,#ff9a6b 0,#5a4a9e 35%,var(--deep) 75%)}
#lobby h1{font-size:44px;font-weight:400;font-style:italic;margin:0 0 4px;letter-spacing:.02em}
#lobby p{margin:0 0 14px;opacity:.75;font-size:16px}
input,button{font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:0;width:min(320px,100%)}
input{background:#ffffff1f;color:var(--ink);text-align:center;outline:1px solid #ffffff33}
input::placeholder{color:#ffffff88}
button{background:var(--glow);color:#2a1c00;font-weight:700}
button.alt{background:#ffffff26;color:var(--ink);font-weight:400}
#msg{min-height:1.4em;font-size:15px;color:#ffd0d0}
#hud{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:none;justify-content:space-between;align-items:flex-start;font-size:15px;text-shadow:0 1px 4px #000;pointer-events:none}
#hud button{pointer-events:auto;width:auto;padding:8px 14px;font-size:14px;background:#00000066;color:var(--ink);font-weight:400}
#stick{position:fixed;z-index:5;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);width:128px;height:128px;border-radius:50%;background:#ffffff1a;outline:1px solid #ffffff33;display:none}
#knob{position:absolute;left:44px;top:44px;width:40px;height:40px;border-radius:50%;background:#ffffffaa}
#jump{position:fixed;z-index:5;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 52px);width:88px;height:88px;border-radius:50%;padding:0;display:none;background:#ffd27acc}
#banner{position:fixed;z-index:6;top:22%;left:0;right:0;text-align:center;font-size:26px;font-style:italic;text-shadow:0 2px 10px #000;opacity:0;transition:opacity .6s;pointer-events:none}#banner small{font-size:12px;letter-spacing:.25em;font-style:normal;opacity:.8}
#use{position:fixed;z-index:5;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 156px);display:none;width:auto;padding:12px 22px;background:#ffffffdd;color:#1a1f3a}
</style>
</head>
<body>
<div id="lobby">
  <h1>The World</h1>
  <p>A world for two.</p>
  <input id="name" placeholder="Your name" maxlength="16" autocomplete="off">
  <button id="create">Create a world</button>
  <input id="code" placeholder="Room code (KAMI-7X4P)" maxlength="9" autocomplete="off" style="text-transform:uppercase">
  <button id="join" class="alt">Join with code</button>
  <div id="msg"></div>
</div>
<div id="hud"><div id="info"></div><button id="share">Invite</button></div>
<div id="stick"><div id="knob"></div></div>
<button id="jump">Jump</button>
<div id="banner"></div><button id="use">Use</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://lzqnxawxehmqgswuzpyn.supabase.co';
const SUPABASE_KEY='sb_publishable_bAm2KsLV8__Y4nWSFesZeQ_38-Ly6DE';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
const msg=t=>$('msg').textContent=t||'';
const ALPHA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genCode=()=>{let s='';for(let i=0;i<8;i++)s+=ALPHA[Math.random()*ALPHA.length|0];return s.slice(0,4)+'-'+s.slice(4)};
const normCode=v=>{const c=v.toUpperCase().replace(/[^A-Z0-9]/g,'');return c.length===8?c.slice(0,4)+'-'+c.slice(4):null};
const myId=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));
const COLORS=['#ff6b8b','#ffb454','#6bd6ff','#8dff9a','#c08bff','#ffe66b'];
const myColor=COLORS[Math.random()*COLORS.length|0];

const pre=new URLSearchParams(location.search).get('room');
if(pre)$('code').value=pre;

$('create').onclick=()=>enter(genCode());
$('join').onclick=()=>{const c=normCode($('code').value);if(!c)return msg('Enter a code like KAMI-7X4P');enter(c)};

let chan,roomCode,myName,entered=false;
const others=new Map(); // id -> {group,tx,ty,tz,tr,meta}

async function enter(code){
  myName=($('name').value.trim()||'Player').slice(0,16);
  roomCode=code;msg('Connecting…');
  chan=sb.channel('world:'+code,{config:{broadcast:{self:false},presence:{key:myId}}});
  chan.on('broadcast',{event:'s'},({payload})=>onState(payload));
  chan.on('presence',{event:'sync'},syncPresence);
  chan.on('broadcast',{event:'c'},({payload})=>take(payload.i,false));
  chan.on('broadcast',{event:'u'},()=>{pulse=1.5;chime()});
  chan.subscribe(async status=>{
    if(status==='SUBSCRIBED'&&!entered){
      await new Promise(r=>setTimeout(r,700));
      if(Object.keys(chan.presenceState()).length>=2){msg('This world is full (2 players max).');sb.removeChannel(chan);return}
      entered=true;
      await chan.track({name:myName,color:myColor});
      startGame();
    }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){msg('Could not connect. Check your connection and try again.')}
  });
}

function syncPresence(){
  if(!entered)return;
  const st=chan.presenceState();
  for(const id of Object.keys(st)){
    if(id===myId||others.has(id))continue;
    const m=st[id][0];addOther(id,m.name,m.color);
  }
  for(const id of [...others.keys()])if(!st[id])removeOther(id);
  updateHud();
}
function updateHud(){
  $('info').innerHTML=roomCode+'  ·  '+(others.size?'Together':'Waiting for your partner…')+'<br>✦ '+got+'/'+orbs.length+'  ·  📍 '+disc.size+'/'+LOCS.length;
}

// ---------- three ----------
let renderer,scene,camera,me,rng;
function hashSeed(s){let h=1779033703;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function label(text){
  const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');
  x.font='bold 32px Georgia';x.textAlign='center';x.lineWidth=6;x.strokeStyle='#000a';x.fillStyle='#fff';
  x.strokeText(text,128,44);x.fillText(text,128,44);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));
  s.scale.set(2.4,.6,1);s.position.y=2.3;s.renderOrder=10;return s;
}
const solids=[];
function makeAvatar(name,color){
  const g=new THREE.Group(),rig=new THREE.Group();g.add(rig);
  const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.6}),cm=M(color),sk=M('#f1c9a5'),dk=M('#2a2f4a');
  const part=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);rig.add(m);return m};
  part(new THREE.CapsuleGeometry(.32,.5,4,10),cm,0,1.15,0);
  part(new THREE.SphereGeometry(.28,14,12),sk,0,1.75,0);
  part(new THREE.BoxGeometry(.4,.14,.16),dk,0,1.78,.2);
  const limb=(x,y,mat,len,r)=>{const p=new THREE.Group();p.position.set(x,y,0);rig.add(p);
    const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,len,3,8),mat);m.position.y=-(len/2+r);p.add(m);return p};
  const arms=[limb(-.42,1.4,cm,.5,.11),limb(.42,1.4,cm,.5,.11)];
  const legs=[limb(-.16,.78,dk,.5,.13),limb(.16,.78,dk,.5,.13)];
  g.add(label(name));
  g.userData={rig,arms,legs,ph:0,land:0};
  return g;
}
function animate(g,dt,st){
  const u=g.userData,air=st==='jump'||st==='fall',w=st==='run'?1:st==='walk'?.6:st==='swim'?.7:0;
  u.ph+=dt*(st==='run'?13:9);const s=Math.sin(u.ph),k=Math.min(1,dt*18);
  const to=(p,v)=>p.rotation.x+=(v-p.rotation.x)*k;
  to(u.legs[0],air?(st==='jump'?-.5:.3):s*w*.9);to(u.legs[1],air?(st==='jump'?.4:-.3):-s*w*.9);
  to(u.arms[0],air?-2.3:st==='swim'?-1.7-s*1.1:-s*w*.8);to(u.arms[1],air?-2.3:st==='swim'?-1.7+s*1.1:s*w*.8);
  const lean=st==='swim'?.9:st==='run'?.25:st==='walk'?.08:0;
  u.rig.rotation.x+=(lean-u.rig.rotation.x)*Math.min(1,dt*10);
  u.land=Math.max(0,u.land-dt);
  u.rig.position.y=(st==='idle'?Math.sin(performance.now()/500)*.015:Math.abs(s)*w*.06);
  u.rig.scale.set(1+u.land*.3,1-u.land*.6,1+u.land*.3);
}

const sstep=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
const TOWN={x:10,z:25};
function H(x,z){
  const d=Math.hypot(x,z);
  let h=Math.max(-3,(1-(d/85)**2)*3.5-.6)+Math.sin(x*.11)*Math.cos(z*.13)*.5;
  h+=26*Math.exp(-(x*x+(z+55)**2)/578);
  const t=1-sstep(14,28,Math.hypot(x-TOWN.x,z-TOWN.z));
  return h*(1-t)+1.6*t;
}
function terrainColor(h,x,z,c){
  if(h<.35)c.set('#e6d3a1');else if(h<9){c.set('#6fae5c');c.offsetHSL(0,0,Math.sin(x*.3+z*.2)*.03)}else if(h<18)c.set('#8d93a0');else c.set('#f2f5ff');
}
function buildWorld(code){
  scene=new THREE.Scene();
  scene.background=new THREE.Color('#9cc7ff');
  scene.fog=new THREE.Fog('#9cc7ff',50,220);
  scene.add(new THREE.HemisphereLight('#ffffff','#5b7a4a',.9));
  const sun=new THREE.DirectionalLight('#fff1cf',.9);sun.position.set(30,50,20);scene.add(sun);
  const geo=new THREE.PlaneGeometry(240,240,120,120);geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position,cols=new Float32Array(pos.count*3),c=new THREE.Color();
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i),h=H(x,z);pos.setY(i,h);terrainColor(h,x,z,c);cols.set([c.r,c.g,c.b],i*3)}
  geo.setAttribute('color',new THREE.BufferAttribute(cols,3));geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1})));
  const sea=new THREE.Mesh(new THREE.CircleGeometry(500,48),new THREE.MeshStandardMaterial({color:'#3f7fd0',roughness:.3,transparent:true,opacity:.9}));
  sea.rotation.x=-Math.PI/2;sea.position.y=-.3;scene.add(sea);
  rng=mulberry(hashSeed(code));
  const trunk=new THREE.MeshStandardMaterial({color:'#6b4a2f'}),leaf=new THREE.MeshStandardMaterial({color:'#2f7d4a'}),rock=new THREE.MeshStandardMaterial({color:'#8d93a0'});
  const dist=(x,z)=>Math.hypot(x-TOWN.x,z-TOWN.z);
  // forest (west) + a few scattered trees
  for(let i=0,n=0;i<700&&n<130;i++){
    const f=n<100,a=rng()*6.283,r=f?rng()*32:rng()*90,x=(f?-45:0)+Math.cos(a)*r,z=(f?15:0)+Math.sin(a)*r,h=H(x,z);
    if(h<.6||h>12||dist(x,z)<22)continue;
    const s=.8+rng()*1.2,t=new THREE.Group();
    const tr=new THREE.Mesh(new THREE.CylinderGeometry(.2*s,.3*s,1.6*s,6),trunk);tr.position.y=.8*s;t.add(tr);
    const lf=new THREE.Mesh(new THREE.ConeGeometry(1.2*s,3*s,7),leaf);lf.position.y=2.6*s;t.add(lf);
    t.position.set(x,h,z);scene.add(t);solids.push({x,z,r:.3*s});n++;
  }
  // rocks on flanks and shore
  for(let i=0,n=0;i<300&&n<30;i++){
    const a=rng()*6.283,r=10+rng()*75,x=Math.cos(a)*r,z=Math.sin(a)*r,h=H(x,z);
    if(h<-.2||dist(x,z)<16)continue;
    const s=.6+rng()*1.6,m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),rock);
    m.position.set(x,h+s*.1,z);m.rotation.set(rng()*3,rng()*3,0);scene.add(m);solids.push({x,z,r:s*.8,h:h+1.1*s});n++;
  }
  // town: plaza, pillar, 7 houses facing the plaza
  const plaza=new THREE.Mesh(new THREE.CylinderGeometry(6,6,.2,24),new THREE.MeshStandardMaterial({color:'#b9b4a8'}));plaza.position.set(TOWN.x,1.55,TOWN.z);scene.add(plaza);
  pil=new THREE.Mesh(new THREE.CylinderGeometry(.5,.6,3,10),new THREE.MeshStandardMaterial({color:'#ffd27a',emissive:'#000000'}));pil.position.set(TOWN.x,3,TOWN.z);scene.add(pil);solids.push({x:TOWN.x,z:TOWN.z,r:.6});
  const wall=['#e8d5b7','#d9b99b','#b5c9d6','#e0b0a0'],roofM=new THREE.MeshStandardMaterial({color:'#a8483a'}),doorM=new THREE.MeshStandardMaterial({color:'#3a2a1f'});
  for(let i=0;i<7;i++){
    const a=i/7*6.283+.3,hx=TOWN.x+Math.cos(a)*13,hz=TOWN.z+Math.sin(a)*13,g=new THREE.Group();
    const b=new THREE.Mesh(new THREE.BoxGeometry(4,3,4),new THREE.MeshStandardMaterial({color:wall[i%4]}));b.position.y=1.5;g.add(b);
    const rf=new THREE.Mesh(new THREE.ConeGeometry(3.4,2,4),roofM);rf.position.y=4;rf.rotation.y=Math.PI/4;g.add(rf);
    const dr=new THREE.Mesh(new THREE.BoxGeometry(1,1.8,.1),doorM);dr.position.set(0,.9,2.02);g.add(dr);
    g.position.set(hx,H(hx,hz),hz);g.rotation.y=Math.atan2(-Math.cos(a),-Math.sin(a));scene.add(g);solids.push({x:hx,z:hz,r:2.6});
  }
  // cave mouth on the mountain's south face
  const cx=8,cz=-33,cg=new THREE.Group(),stone=new THREE.MeshStandardMaterial({color:'#7a7f8c'});
  cg.position.set(cx,H(cx,cz),cz);
  for(const px of [-2.4,2.4]){const p=new THREE.Mesh(new THREE.BoxGeometry(1.4,5,1.6),stone);p.position.set(px,1.5,0);cg.add(p);solids.push({x:cx+px,z:cz,r:.7})}
  const lin=new THREE.Mesh(new THREE.BoxGeometry(6.4,1.3,1.8),stone);lin.position.y=4.3;cg.add(lin);
  const dk=new THREE.Mesh(new THREE.BoxGeometry(3.6,4.2,.4),new THREE.MeshBasicMaterial({color:'#05060c'}));dk.position.set(0,1.9,-.6);cg.add(dk);
  solids.push({x:cx,z:cz-1,r:1.6});scene.add(cg);
  // collectible star shards (2 by the peak/cave, 3 out in the water, rest on land)
  const om=new THREE.MeshStandardMaterial({color:'#ffe08a',emissive:'#ffb020',emissiveIntensity:.9}),pts=[[0,-55],[8,-29]];
  for(let i=0;i<3;i++){const a=rng()*6.283;pts.push([Math.cos(a)*91,Math.sin(a)*91])}
  while(pts.length<24){const a=rng()*6.283,r=5+rng()*78,x=Math.cos(a)*r,z=Math.sin(a)*r,h=H(x,z);if(h>.5&&h<22&&dist(x,z)>20)pts.push([x,z])}
  for(const [x,z] of pts){const m=new THREE.Mesh(new THREE.OctahedronGeometry(.4),om),y=Math.max(H(x,z),-.8)+1.1;m.position.set(x,y,z);scene.add(m);orbs.push({m,x,z,y,on:true})}
}

const S={x:0,y:0,z:0,vy:0,rot:0,yaw:0,pitch:.35,grounded:true,state:'idle'};

function startGame(){
  $('lobby').style.display='none';
  ['hud','stick'].forEach(i=>$(i).style.display=i==='hud'?'flex':'block');$('jump').style.display='block';
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);
  camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,600);
  buildWorld(roomCode);load();
  me=makeAvatar(myName,myColor);scene.add(me);
  // spawn: slot by join order (offset so partners don't overlap)
  S.x=TOWN.x+(Math.random()-.5)*4;S.z=TOWN.z+7+(Math.random()-.5)*2;S.y=H(S.x,S.z)+.1;
  addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
  bindInput();syncPresence();updateHud();
  history.replaceState(null,'','?room='+roomCode);
  requestAnimationFrame(tick);
  setInterval(send,100);
}

function addOther(id,name,color){
  const g=makeAvatar(name||'Partner',color||'#fff');scene.add(g);
  others.set(id,{group:g,tx:0,ty:0,tz:0,tr:0,st:'idle'});
}
function removeOther(id){const o=others.get(id);if(o){scene.remove(o.group);others.delete(id)}updateHud()}
function onState(p){
  let o=others.get(p.id);
  if(!o){const m=(chan.presenceState()[p.id]||[{}])[0];addOther(p.id,m.name,m.color);o=others.get(p.id);o.group.position.set(p.x,p.y,p.z)}
  o.tx=p.x;o.ty=p.y;o.tz=p.z;o.tr=p.r;
  if(o.st==='fall'&&p.st!=='fall'&&p.st!=='jump')o.group.userData.land=.15;o.st=p.st||'idle';
}
function send(){
  if(!chan||!entered)return;
  chan.send({type:'broadcast',event:'s',payload:{id:myId,x:+S.x.toFixed(2),y:+S.y.toFixed(2),z:+S.z.toFixed(2),r:+S.rot.toFixed(2),st:S.state}});
}

// ---------- input ----------
const keys={};let stickV={x:0,y:0},jumpQ=false;
function bindInput(){
  addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')jumpQ=true;if(e.code==='KeyE')doUse()});
  addEventListener('keyup',e=>keys[e.code]=false);
  const stick=$('stick'),knob=$('knob');let sid=null;
  const setStick=e=>{const r=stick.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const m=Math.hypot(dx,dy),max=r.width/2;if(m>max){dx*=max/m;dy*=max/m}
    knob.style.left=(44+dx)+'px';knob.style.top=(44+dy)+'px';stickV={x:dx/max,y:dy/max}};
  stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);setStick(e)});
  stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)setStick(e)});
  const endStick=e=>{if(e.pointerId===sid){sid=null;stickV={x:0,y:0};knob.style.left='44px';knob.style.top='44px'}};
  stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
  $('jump').addEventListener('pointerdown',e=>{jumpQ=true;e.preventDefault()});
  $('use').addEventListener('pointerdown',e=>{doUse();e.preventDefault()});
  // look
  let lid=null,lx=0,ly=0;const cv=renderer.domElement;
  cv.addEventListener('pointerdown',e=>{lid=e.pointerId;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(lid)});
  cv.addEventListener('pointermove',e=>{if(e.pointerId!==lid)return;S.yaw-=(e.clientX-lx)*.006;S.pitch=Math.max(.05,Math.min(1.2,S.pitch+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY});
  const endLook=e=>{if(e.pointerId===lid)lid=null};cv.addEventListener('pointerup',endLook);cv.addEventListener('pointercancel',endLook);
  $('share').onclick=async()=>{
    const url=location.origin+location.pathname+'?room='+roomCode;
    try{if(navigator.share)await navigator.share({title:'The World',text:'Join me. Code: '+roomCode,url});else{await navigator.clipboard.writeText(url);$('share').textContent='Copied'}}catch(e){}
  };
}

// ---------- exploration ----------
const LOCS=[{n:'Town Square',x:10,z:25,r:9},{n:'Whispering Forest',x:-45,z:15,r:18},{n:'Shell Beach',x:0,z:72,r:12},{n:'Sky Peak',x:0,z:-55,r:9,y:20},{n:'The Cave',x:8,z:-30,r:5}];
let disc=new Set(),orbs=[],got=0,pil,pulse=0,nearP=false;
function save(){try{localStorage.setItem('w:'+roomCode,JSON.stringify({d:[...disc],o:orbs.map((o,i)=>o.on?-1:i).filter(i=>i>=0)}))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem('w:'+roomCode)||'{}');disc=new Set(v.d||[]);for(const i of v.o||[])if(orbs[i]){orbs[i].on=false;orbs[i].m.visible=false;got++}}catch(e){}}
function banner(t){const b=$('banner');b.innerHTML='<small>NEW LOCATION DISCOVERED</small><br>'+t;b.style.opacity=1;clearTimeout(banner.t);banner.t=setTimeout(()=>b.style.opacity=0,3200)}
function take(i,local){const o=orbs[i];if(!o||!o.on)return;o.on=false;o.m.visible=false;got++;save();updateHud();if(local&&chan)chan.send({type:'broadcast',event:'c',payload:{i}})}
function chime(){try{const a=new(window.AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=660;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.4);o.start();o.stop(a.currentTime+1.4)}catch(e){}}
function doUse(){if(!nearP)return;pulse=1.5;chime();if(chan)chan.send({type:'broadcast',event:'u',payload:{}})}
function explore(dt,t){
  for(const L of LOCS)if(!disc.has(L.n)&&Math.hypot(S.x-L.x,S.z-L.z)<L.r&&(!L.y||S.y>L.y)){disc.add(L.n);banner(L.n);save();updateHud()}
  orbs.forEach((o,i)=>{if(!o.on)return;o.m.rotation.y+=dt*2;o.m.position.y=o.y+Math.sin(t/400+i)*.15;
    if(Math.hypot(S.x-o.x,S.z-o.z)<1.6&&Math.abs(S.y+1-o.y)<2.2)take(i,true)});
  const n=Math.hypot(S.x-TOWN.x,S.z-TOWN.z)<3.4;if(n!==nearP){nearP=n;$('use').style.display=n?'block':'none'}
  if(pulse>0){pulse=Math.max(0,pulse-dt);pil.material.emissive.setRGB(pulse*.6,pulse*.45,pulse*.1)}
}

// ---------- loop ----------
let last=performance.now(),camY=0;
const lerpAngle=(a,b,t)=>{let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t};
function tick(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  let ix=stickV.x,iy=stickV.y;
  if(keys.KeyA||keys.ArrowLeft)ix-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;
  if(keys.KeyW||keys.ArrowUp)iy-=1;if(keys.KeyS||keys.ArrowDown)iy+=1;
  const len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len}
  const sprint=keys.ShiftLeft||len>.9;
  const speed=(sprint?9:5.5)*Math.min(1,len)*(H(S.x,S.z)<-.5?.5:1);
  const sy=Math.sin(S.yaw),cy=Math.cos(S.yaw),px=S.x,pz=S.z;
  const dx=cy*ix+sy*iy,dz=-sy*ix+cy*iy;
  if(len>.05){S.x+=dx*speed*dt;S.z+=dz*speed*dt;S.rot=lerpAngle(S.rot,Math.atan2(dx,dz),1-Math.exp(-14*dt))}
  const rr=Math.hypot(S.x,S.z);if(rr>100){S.x*=100/rr;S.z*=100/rr}
  let gY=H(S.x,S.z);const wat=gY<-.5;if(wat)gY=-.8;
  for(const c of solids){const ax=S.x-c.x,az=S.z-c.z,dd=Math.hypot(ax,az),R=c.r+.4;
    if(dd<R){if(c.h&&S.y>=c.h-.15)gY=Math.max(gY,c.h);else if(dd>1e-4){S.x=c.x+ax/dd*R;S.z=c.z+az/dd*R}}}
  const wasG=S.grounded;
  if(jumpQ&&wasG)S.vy=wat?6:9;jumpQ=false;
  S.vy-=25*dt;const imp=-S.vy;S.y+=S.vy*dt;
  if(S.y<=gY||(wasG&&S.vy<=0&&S.y-gY<.35)){S.y=gY;S.vy=0;S.grounded=true;if(!wasG&&imp>5)me.userData.land=Math.min(.18,imp*.014)}else S.grounded=false;
  S.state=!S.grounded?(S.vy>0?'jump':'fall'):wat?'swim':len>.05?(sprint?'run':'walk'):'idle';
  me.position.set(S.x,S.y,S.z);me.rotation.y=S.rot;animate(me,dt,S.state);explore(dt,t);
  const k=1-Math.exp(-12*dt);
  for(const o of others.values()){
    const p=o.group.position;p.x+=(o.tx-p.x)*k;p.y+=(o.ty-p.y)*k;p.z+=(o.tz-p.z)*k;
    o.group.rotation.y=lerpAngle(o.group.rotation.y,o.tr,k);animate(o.group,dt,o.st);
  }
  camY+=(S.y-camY)*(1-Math.exp(-6*dt));
  const d=9,cp=Math.cos(S.pitch);
  const cx=S.x+Math.sin(S.yaw)*d*cp,cz=S.z+Math.cos(S.yaw)*d*cp;
  camera.position.set(cx,Math.max(H(cx,cz)+.8,camY+1.6+Math.sin(S.pitch)*d),cz);
  camera.lookAt(S.x,camY+1.4,S.z);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
</script>
